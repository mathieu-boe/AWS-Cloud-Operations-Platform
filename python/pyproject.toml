[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudops"
version = "0.1.0"
description = "AWS Cloud Operations Platform"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.42,<2",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "moto>=5,<6",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
